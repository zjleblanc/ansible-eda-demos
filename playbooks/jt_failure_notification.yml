---
- name: Notify AI Agent Failure Analysis
  hosts: localhost
  gather_facts: false

  vars:
    # Required inputs from the AI Agent task
    job_link: ""
    repo_url: ""
    playbook_path: ""
    task_path: ""
    root_cause: ""
    suggested_fix: ""
    notification_recipients: [zleblanc@redhat.com]

    # SMTP Settings (injected via extra_vars)
    smtp_server: "{{ email_smtp_server | default(MAILHOST) | default('') }}"
    smtp_port: "{{ email_smtp_server_port | default(MAILHOST_PORT) | default(587) }}"
    smtp_username: "{{ email_smtp_username | default(MAILHOST_USERNAME) | default('') }}"
    smtp_password: "{{ email_smtp_password | default(MAILHOST_PASSWORD) | default('') }}"
    smtp_from: "{{ email_smtp_from_address | default('aap-failure-bot@example.com') }}"

  tasks:
    - name: Validate required inputs
      ansible.builtin.assert:
        that:
          - job_link != ""
          - playbook_path != ""
          - root_cause != ""
          - notification_recipients | length > 0
          - smtp_server != ""
        fail_msg: "Missing required variables. Ensure AI Agent payload and SMTP credentials are provided."

    - name: Debug AI Failure Analysis
      ansible.builtin.debug:
        msg:
          - "Playbook: {{ playbook_path }}"
          - "Location: {{ task_path }}"
          - "Root Cause: {{ root_cause }}"

    - name: Send Failure Notification Email
      community.general.mail:
        host: "{{ smtp_server }}"
        port: "{{ smtp_port }}"
        username: "{{ smtp_username }}"
        password: "{{ smtp_password }}"
        to: "{{ notification_recipients }}"
        from: "{{ smtp_from }}"
        subject: "[AAP Failure] Analysis for {{ playbook_path }}"
        subtype: html
        body: "{{ lookup('ansible.builtin.template', '../templates/ai_failure_notification.html.j2') }}"
